[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorgrad"
version = "0.1.0"
description = "A small autograd engine built from scratch: scalars, then N-d tensors, then CNNs."
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
dev = ["matplotlib"]

[tool.setuptools.packages.find]
include = ["tensorgrad*"]
